        type: APIReference
      - url: https://docs.whereby.com/reference/recordings
        type: APIReference
      - url: https://docs.whereby.com/reference/transcriptions
        type: APIReference
      - url: https://docs.whereby.com/reference/summaries
        type: APIReference
      - url: https://docs.whereby.com/reference/insights
        type: APIReference
  - aid: whereby:whereby-webhooks
    name: Whereby Webhooks
    description: Outbound webhook notifications for room and session lifecycle events including client join/leave, knock, session start/end, recording finished, transcription started/finished/failed, and assistant requested. Signed with the Whereby-Signature header.
    tags:
      - Webhooks
      - Events
      - Async
    properties:
      - url: https://docs.whereby.com/reference/webhooks
        type: Documentation
