aid: whereby
name: Whereby
description: Whereby is an embeddable video API plus standalone meetings product that
  lets developers add browser-based, no-download video calls to their apps with a
  few lines of code or build deeply customized experiences via SDKs. The REST API
  at api.whereby.dev/v1 covers meetings, rooms, recordings, transcriptions, summaries,
  and insights.
